name: "Terraform CI/CD Pipeline"

# 1. 트리거 조건 설정: 어떤 이벤트에서 워크플로우를 실행할지 지정
on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform Action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

# 2. 권한 설정 (OpenId Connerct 또는 시크릿 접근 권한)
permissions:
  contents: read

jobs:
  terraform:
    # 전체 작업에 대한 서버 구성 밒 배포 설정 파일의 위치
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/project

    steps:
      # 3. 소스 코드 체크아웃(체크아웃?: 저장소의 파일을 러너로 다운로드)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 4. Terraform CLI 도구 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.x

      # 5. AWS 인증 정보 설정 (Git hub Secret 활용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          output-env-credentials: true

      # 6. 테라폼 초기화 (Provider 다운로드)
      - name: Terraform Init
        run: terraform init -reconfigure

      # 7. 테라폼 코드 포맷 검증
      - name: Terraform Format Check
        run: terraform fmt -check

      # 8. 변셩 사항 미리보기 (Plan)
      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform plan -no-color
        continue-on-error: false

      # 9. 인프라 반영 (Apply / Destory)
      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve